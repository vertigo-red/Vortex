name: ChatGPT workspace test diagnostics

on:
  push:
    branches:
      - "linux/native-readiness-chatgpt-sol56-20260909"
  workflow_dispatch:

concurrency:
  group: chatgpt-test-diagnostics-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NX_DAEMON: false
      VORTEX_ELECTRON_REBUILD: defer
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.10.0

      - uses: actions/setup-node@v6
        with:
          node-version: "24.20.0"
          cache: "pnpm"

      - name: Fix pnpm node-gyp permissions
        run: find "$PNPM_HOME" -path '*/node-gyp/gyp/gyp_main.py' -exec chmod +x {} \;

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libarchive-dev libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 libpango-1.0-0 libcairo2 libgl1 libgtk-3-0 xvfb

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Rebuild Electron native modules
        run: pnpm --filter @vortex/main exec electron-rebuild

      - name: Unit test targets
        id: unit
        continue-on-error: true
        timeout-minutes: 15
        shell: bash
        run: |
          set -o pipefail
          pnpm nx run-many -t test --exclude @vortex/e2e --outputStyle=stream 2>&1 | tee test-unit-linux.log

      - name: Integration test targets
        id: integration
        continue-on-error: true
        timeout-minutes: 15
        shell: bash
        run: |
          set -o pipefail
          pnpm nx run-many -t test:integration --exclude @vortex/e2e --outputStyle=stream 2>&1 | tee test-integration-linux.log

      - name: Upload Linux test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-workspace-linux
          path: test-*-linux.log
          if-no-files-found: error

      - name: Fail on Linux test errors
        if: always() && (steps.unit.outcome != 'success' || steps.integration.outcome != 'success')
        run: exit 1

  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      NX_DAEMON: false
      VORTEX_ELECTRON_REBUILD: defer
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.10.0

      - uses: actions/setup-node@v6
        with:
          node-version: "24.20.0"
          cache: "pnpm"

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Unit test targets
        id: unit
        continue-on-error: true
        timeout-minutes: 20
        shell: pwsh
        run: |
          pnpm nx run-many -t test --exclude @vortex/e2e --outputStyle=stream 2>&1 | Tee-Object -FilePath test-unit-windows.log
          $exitCode = $LASTEXITCODE
          exit $exitCode

      - name: Integration test targets
        id: integration
        continue-on-error: true
        timeout-minutes: 20
        shell: pwsh
        run: |
          pnpm nx run-many -t test:integration --exclude @vortex/e2e --outputStyle=stream 2>&1 | Tee-Object -FilePath test-integration-windows.log
          $exitCode = $LASTEXITCODE
          exit $exitCode

      - name: Upload Windows test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-workspace-windows
          path: test-*-windows.log
          if-no-files-found: error

      - name: Fail on Windows test errors
        if: always() && (steps.unit.outcome != 'success' || steps.integration.outcome != 'success')
        shell: pwsh
        run: exit 1
