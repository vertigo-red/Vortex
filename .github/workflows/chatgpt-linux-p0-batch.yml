name: ChatGPT Linux P0 batch

on:
  push:
    branches: [linux/native-readiness-chatgpt-sol56-20260909]
    paths: [.github/chatgpt-linux-p0-request]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'vertigo-red'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply P0 filesystem fixes
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent

          def replace_once(p, old, new, label):
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, got {count}")
              p.write_text(text.replace(old, new, 1))

          p = Path("src/renderer/src/extensions/gamemode_management/index.ts")
          replace_once(
              p,
              '''    const len =\n      process.platform === "win32"\n        ? filePath.split(/[/\\\\]/).length\n        : filePath.split(path.sep).length;''',
              '''    const len = filePath.replace(/\\\\/g, "/").split("/").length;''',
              "searchDepth separators",
          )

          Path("extensions/gamebryo-archive-support/src/archivePath.ts").write_text(dedent(r'''
          import * as fs from "node:fs/promises";
          import * as path from "node:path";

          export function archiveOutputPath(root: string, archiveName: string): string {
            const name = archiveName.replace(/\\/g, "/");
            if (!name || name.includes("\0") || path.posix.isAbsolute(name) || path.win32.isAbsolute(name)
                || /^[a-z]:/i.test(name) || name.split("/").includes("..")) {
              throw new Error(`Invalid archive path: "${archiveName}"`);
            }
            return path.join(root, ...name.split("/"));
          }

          function inside(root: string, candidate: string): boolean {
            const rel = path.relative(root, candidate);
            return rel === "" || (!rel.startsWith(`..${path.sep}`) && rel !== ".." && !path.isAbsolute(rel));
          }

          export async function prepareArchiveOutputPath(root: string, archiveName: string): Promise<string> {
            const lexical = archiveOutputPath(root, archiveName);
            await fs.mkdir(root, { recursive: true });
            const canonicalRoot = await fs.realpath(root);
            const relative = path.relative(path.resolve(root), path.resolve(lexical));
            const parts = relative.split(path.sep).filter((part) => part.length > 0);
            if (parts.length === 0) throw new Error(`Invalid archive path: "${archiveName}"`);
            let current = canonicalRoot;
            for (const part of parts.slice(0, -1)) {
              const next = path.join(current, part);
              try {
                const stat = await fs.lstat(next);
                if (stat.isSymbolicLink()) {
                  const target = await fs.realpath(next);
                  if (!inside(canonicalRoot, target)) {
                    throw new Error(`Archive path escapes extraction root through symlink: "${archiveName}"`);
                  }
                  if (!(await fs.stat(target)).isDirectory()) {
                    throw new Error(`Archive parent is not a directory: "${archiveName}"`);
                  }
                  current = target;
                } else if (stat.isDirectory()) {
                  current = await fs.realpath(next);
                } else {
                  throw new Error(`Archive parent is not a directory: "${archiveName}"`);
                }
              } catch (err) {
                if ((err as NodeJS.ErrnoException).code !== "ENOENT") throw err;
                await fs.mkdir(next);
                current = await fs.realpath(next);
              }
              if (!inside(canonicalRoot, current)) {
                throw new Error(`Archive path escapes extraction root: "${archiveName}"`);
              }
            }
            const output = path.join(current, parts[parts.length - 1]);
            try {
              if ((await fs.lstat(output)).isSymbolicLink()) {
                throw new Error(`Archive output is a symlink: "${archiveName}"`);
              }
            } catch (err) {
              if ((err as NodeJS.ErrnoException).code !== "ENOENT") throw err;
            }
            return output;
          }
          ''').lstrip())

          for file in ["bsa.ts", "ba2.ts"]:
              p = Path("extensions/gamebryo-archive-support/src") / file
              text = p.read_text()
              if text.count('import { archiveOutputPath } from "./archivePath";') != 1:
                  raise SystemExit(f"{file}: import mismatch")
              text = text.replace('import { archiveOutputPath } from "./archivePath";',
                                  'import { prepareArchiveOutputPath } from "./archivePath";')
              if text.count("archiveOutputPath(outputPath,") != 2:
                  raise SystemExit(f"{file}: output call mismatch")
              p.write_text(text.replace("archiveOutputPath(outputPath,", "await prepareArchiveOutputPath(outputPath,"))

          Path("extensions/gamebryo-archive-support/src/archivePath.test.ts").write_text(dedent(r'''
          import * as fs from "node:fs/promises";
          import * as os from "node:os";
          import * as path from "node:path";
          import { describe, expect, it } from "vitest";
          import { archiveOutputPath, prepareArchiveOutputPath } from "./archivePath";
          import { BA2Archive } from "./ba2";

          describe("archive extraction paths", () => {
            it("maps Windows separators", () => {
              expect(archiveOutputPath("/game", "textures\\armor\\file.dds"))
                .toBe(path.join("/game", "textures", "armor", "file.dds"));
            });
            it.each(["../escape", "data\\..\\escape", "/etc/file", "C:\\file", "C:file", "\\\\server\\file", "", "nul\0file"])
              ("rejects invalid path %j", (name) => expect(() => archiveOutputPath("/game", name)).toThrow("Invalid archive path"));
            it("extracts a BA2 entry through the production path", async () => {
              const root = await fs.mkdtemp(path.join(os.tmpdir(), "vortex-ba2-path-"));
              try {
                const source = path.join(root, "payload"); await fs.writeFile(source, "test");
                const archive = new BA2Archive(source, { type: "general", version: 1 } as any,
                  ["meshes\\test.nif"], [{ offset: 0, packedLen: 0, unpackedLen: 4 } as any]);
                const output = path.join(root, "out"); await archive.extractAll(output);
                expect(await fs.readFile(path.join(output, "meshes", "test.nif"), "utf8")).toBe("test");
              } finally { await fs.rm(root, { recursive: true, force: true }); }
            });
            it.runIf(process.platform !== "win32")("rejects a parent symlink escaping root", async () => {
              const base = await fs.mkdtemp(path.join(os.tmpdir(), "vortex-archive-link-"));
              try {
                const root = path.join(base, "root"), outside = path.join(base, "outside");
                await fs.mkdir(root); await fs.mkdir(outside);
                const sentinel = path.join(outside, "sentinel.txt"); await fs.writeFile(sentinel, "unchanged");
                await fs.symlink(outside, path.join(root, "Data"));
                await expect(prepareArchiveOutputPath(root, "Data/probe.txt")).rejects.toThrow("symlink");
                expect(await fs.readFile(sentinel, "utf8")).toBe("unchanged");
                await expect(fs.stat(path.join(outside, "probe.txt"))).rejects.toMatchObject({ code: "ENOENT" });
              } finally { await fs.rm(base, { recursive: true, force: true }); }
            });
            it.runIf(process.platform !== "win32")("allows root itself to be a symlink", async () => {
              const base = await fs.mkdtemp(path.join(os.tmpdir(), "vortex-archive-root-link-"));
              try {
                const realRoot = path.join(base, "real"), linkRoot = path.join(base, "link");
                await fs.mkdir(realRoot); await fs.symlink(realRoot, linkRoot);
                expect(await prepareArchiveOutputPath(linkRoot, "Data/file.txt")).toBe(path.join(realRoot, "Data", "file.txt"));
              } finally { await fs.rm(base, { recursive: true, force: true }); }
            });
            it.runIf(process.platform !== "win32")("rejects a final output symlink", async () => {
              const base = await fs.mkdtemp(path.join(os.tmpdir(), "vortex-archive-final-link-"));
              try {
                const root = path.join(base, "root"), outside = path.join(base, "outside.txt");
                await fs.mkdir(root); await fs.writeFile(outside, "sentinel"); await fs.symlink(outside, path.join(root, "file.txt"));
                await expect(prepareArchiveOutputPath(root, "file.txt")).rejects.toThrow("symlink");
                expect(await fs.readFile(outside, "utf8")).toBe("sentinel");
              } finally { await fs.rm(base, { recursive: true, force: true }); }
            });
          });
          ''').lstrip())
      - name: Commit P0 source batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/src/extensions/gamemode_management/index.ts \
                  extensions/gamebryo-archive-support/src/archivePath.ts \
                  extensions/gamebryo-archive-support/src/archivePath.test.ts \
                  extensions/gamebryo-archive-support/src/bsa.ts \
                  extensions/gamebryo-archive-support/src/ba2.ts
          git diff --cached --check
          git commit -m "fix(linux): harden archive writes and game path probing"
          git push origin HEAD:${GITHUB_REF_NAME}
