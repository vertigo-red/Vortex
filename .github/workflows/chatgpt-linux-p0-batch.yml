name: ChatGPT Linux P0 deployment patch

on:
  push:
    branches:
      - linux/native-readiness-chatgpt-sol56-20260909
    paths:
      - .github/chatgpt-linux-p0-request

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'vertigo-red'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply guarded deployment containment patch
        run: python scripts/chatgpt-linux-p0-deployment.py
      - name: Verify patch shape
        run: |
          git diff --check
          git diff --stat
          grep -RInE 'assertPathMutation|assertDataMutation|SafePathBoundary' \
            src/renderer/src/extensions/mod_management \
            src/renderer/src/extensions/hardlink_activator \
            src/renderer/src/extensions/move_activator \
            src/renderer/src/extensions/symlink_activator \
            src/renderer/src/extensions/symlink_activator_elevate \
            src/shared/src/safePath.ts | head -n 160
      - name: Commit deployment containment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/shared/src/safePath.ts \
                  src/renderer/src/extensions/mod_management/LinkingDeployment.ts \
                  src/renderer/src/extensions/mod_management/LinkingDeployment.test.ts \
                  src/renderer/src/extensions/hardlink_activator/index.ts \
                  src/renderer/src/extensions/move_activator/index.ts \
                  src/renderer/src/extensions/symlink_activator/index.ts \
                  src/renderer/src/extensions/symlink_activator_elevate/index.ts
          git diff --cached --check
          git commit -m "fix(linux): enforce containment at deployment mutations"
          git push origin HEAD:${GITHUB_REF_NAME}
