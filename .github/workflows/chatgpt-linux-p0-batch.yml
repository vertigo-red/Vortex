name: ChatGPT Linux P0 diagnostic

on:
  push:
    branches: [linux/native-readiness-chatgpt-sol56-20260909]
    paths: [.github/chatgpt-linux-p0-request]

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor == 'vertigo-red'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Locate deployment mutation implementations
        shell: bash
        run: |
          set -euo pipefail
          echo '=== LinkingActivator subclasses / implementations ==='
          grep -RInE 'extends[[:space:]]+LinkingActivator|purgeLinks\(|linkFile\(|unlinkFile\(' src/renderer/src/extensions --include='*.ts' --include='*.tsx' || true
          echo '=== fallback purge ==='
          grep -RInE 'fallbackPurge|removeAsync\(|unlinkAsync\(|renameAsync\(' src/renderer/src/extensions/mod_management --include='*.ts' --include='*.tsx' | head -n 250 || true
