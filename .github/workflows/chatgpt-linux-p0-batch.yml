name: ChatGPT Linux P0 deployment follow-up

on:
  push:
    branches:
      - linux/native-readiness-chatgpt-sol56-20260909
    paths:
      - .github/chatgpt-linux-p0-request

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'vertigo-red'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply final filesystem containment patch
        run: python scripts/chatgpt-linux-p0-followup.py
      - name: Verify patch shape
        run: |
          git diff --check
          git diff --stat
          grep -RInE 'SafePathBoundary|securityRoot|assertMutation' \
            src/renderer/src/extensions/mod_management/LinkingDeployment.ts \
            src/renderer/src/extensions/mod_management/util/externalChanges.ts \
            src/renderer/src/extensions/mod_management/util/activationStore.ts \
            src/renderer/src/extensions/mod_management/util/*Paths.test.ts | head -n 200
      - name: Commit final containment fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/src/extensions/mod_management/LinkingDeployment.ts \
                  src/renderer/src/extensions/mod_management/LinkingDeployment.test.ts \
                  src/renderer/src/extensions/mod_management/util/externalChanges.ts \
                  src/renderer/src/extensions/mod_management/util/externalChangesPaths.test.ts \
                  src/renderer/src/extensions/mod_management/util/activationStore.ts \
                  src/renderer/src/extensions/mod_management/util/activationStorePaths.test.ts
          git diff --cached --check
          git commit -m "fix(linux): close remaining filesystem mutation escapes"
          git push origin HEAD:${GITHUB_REF_NAME}
