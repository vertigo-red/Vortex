name: ChatGPT Flatpak pnpm source refresh

on:
  push:
    branches:
      - linux/native-readiness-chatgpt-sol56-20260909
    paths:
      - .github/chatgpt-flatpak-source-refresh-request

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor == 'vertigo-red'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Regenerate pnpm Flatpak sources
        run: |
          set -euo pipefail
          python flatpak/scripts/flatpak_sources.py --only pnpm --force | tee /tmp/flatpak-source-refresh.log
          grep -F 'removed 3 pnpm-managed runtime block(s)' /tmp/flatpak-source-refresh.log
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('flatpak/generated-sources.json')
          data = json.loads(p.read_text())
          assert len(data) > 1000, len(data)
          text = p.read_text()
          assert 'node-runtime:' not in text
          print('generated source entries:', len(data))
          print('generated hash:', Path('flatpak/generated-sources.hash').read_text().strip())
          PY
          git diff --check
      - name: Commit refreshed sources
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flatpak/generated-sources.json flatpak/generated-sources.hash
          if git diff --cached --quiet; then
            echo 'No generated source changes.'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'chore(flatpak): refresh pnpm offline sources'
          git push origin HEAD:${GITHUB_REF_NAME}
