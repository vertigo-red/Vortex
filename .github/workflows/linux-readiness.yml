name: Linux readiness (fork branch)

# Workflow for the native Linux port, restricted to the fork and the dedicated
# branch. verify runs on every push; the package job's heavy steps run only
# while the tracked marker file `docs/linux/PACKAGING-MARKER` exists (or
# manually, where dispatch is registered). Nothing here signs, publishes
# releases, runs NPM publish, or touches upstream secrets.

on:
  push:
    branches:
      - "linux/native-readiness-*"
  workflow_dispatch:

concurrency:
  group: linux-readiness-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'vertigo-red/Vortex' && startsWith(github.ref_name, 'linux/native-readiness-')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NX_DAEMON: false
      VORTEX_ELECTRON_REBUILD: defer
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.10.0

      - uses: actions/setup-node@v6
        with:
          node-version: "24.20.0"
          cache: "pnpm"

      - name: Fix pnpm node-gyp permissions
        run: find "$PNPM_HOME" -path '*/node-gyp/gyp/gyp_main.py' -exec chmod +x {} \;

      - name: Install native build dependencies
        # fontconfig/libarchive are build-time; the GUI/runtime set is what a
        # packaged Electron needs to actually start (used by the boot smoke).
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libarchive-dev rpm libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 libpango-1.0-0 libcairo2 libgl1 libgtk-3-0 xvfb

      - name: Cache native module builds
        uses: actions/cache@v6
        with:
          path: |
            node_modules/.pnpm/@nexusmods+fomod-installer-native@*/node_modules/@nexusmods/fomod-installer-native/build
            node_modules/.pnpm/@nexusmods+fomod-installer-native@*/node_modules/@nexusmods/fomod-installer-native/bin
            node_modules/.pnpm/drivelist@*/node_modules/drivelist/build
            node_modules/.pnpm/drivelist@*/node_modules/drivelist/bin
            node_modules/.pnpm/leveldown@*/node_modules/leveldown/build
            node_modules/.pnpm/xxhash-addon@*/node_modules/xxhash-addon/bin
            node_modules/.pnpm/@parcel+watcher@*/node_modules/@parcel/watcher/build
            node_modules/.pnpm/@parcel+watcher@*/node_modules/@parcel/watcher/bin
          key: linux-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'src/main/postinstall.mjs') }}

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Rebuild Electron native modules
        run: pnpm --filter @vortex/main exec electron-rebuild

      - name: Format workspace
        run: pnpm run format

      - name: Build workspace
        run: pnpm run build

      - name: Test workspace
        run: pnpm run test

  verify-windows:
    # Regression gate: the port touches cross-platform code (deployment,
    # StarterInfo, Steam, archives, protocol registration). Keep Windows
    # build+test green on every change so Linux work cannot silently break it.
    # Ordinary GitHub-hosted runner; no secrets.
    if: github.repository == 'vertigo-red/Vortex' && startsWith(github.ref_name, 'linux/native-readiness-')
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      NX_DAEMON: false
      VORTEX_ELECTRON_REBUILD: defer
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.10.0

      - uses: actions/setup-node@v6
        with:
          node-version: "24.20.0"
          cache: "pnpm"

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Format workspace
        run: pnpm run format

      - name: Build workspace
        run: pnpm run build

      - name: Test workspace
        run: pnpm run test

  package:
    needs: [verify, verify-windows]
    # The job always runs (cheap until the marker test). The expensive
    # packaging steps are gated individually: hashFiles is evaluated at step
    # level, which the workflow validator accepts, and it is deterministic --
    # a commit-message scan of the push head_commit payload is not. The
    # marker is committed while artifacts are wanted and deleted once they
    # are not; dispatch always packages.
    if: github.repository == 'vertigo-red/Vortex' && startsWith(github.ref_name, 'linux/native-readiness-')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NX_DAEMON: false
      VORTEX_ELECTRON_REBUILD: defer
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.10.0

      - uses: actions/setup-node@v6
        with:
          node-version: "24.20.0"
          cache: "pnpm"

      - name: Fix pnpm node-gyp permissions
        run: find "$PNPM_HOME" -path '*/node-gyp/gyp/gyp_main.py' -exec chmod +x {} \;

      - name: Install native build dependencies
        # fontconfig/libarchive are build-time; the GUI/runtime set is what a
        # packaged Electron needs to actually start (used by the boot smoke).
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libarchive-dev rpm libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 libpango-1.0-0 libcairo2 libgl1 libgtk-3-0 xvfb

      - name: Cache native module builds
        uses: actions/cache@v6
        with:
          path: |
            node_modules/.pnpm/@nexusmods+fomod-installer-native@*/node_modules/@nexusmods/fomod-installer-native/build
            node_modules/.pnpm/@nexusmods+fomod-installer-native@*/node_modules/@nexusmods/fomod-installer-native/bin
            node_modules/.pnpm/drivelist@*/node_modules/drivelist/build
            node_modules/.pnpm/drivelist@*/node_modules/drivelist/bin
            node_modules/.pnpm/leveldown@*/node_modules/leveldown/build
            node_modules/.pnpm/xxhash-addon@*/node_modules/xxhash-addon/bin
            node_modules/.pnpm/@parcel+watcher@*/node_modules/@parcel/watcher/build
            node_modules/.pnpm/@parcel+watcher@*/node_modules/@parcel/watcher/bin
          key: linux-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'src/main/postinstall.mjs') }}

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Set test version
        if: github.event_name == 'workflow_dispatch' || hashFiles('docs/linux/PACKAGING-MARKER') != ''
        run: >-
          pnpm -F @vortex/main version
          1.0.0-linux.${{ github.run_number }}
          --no-git-tag-version --no-git-checks --allow-same-version

      - name: Build workspace
        if: github.event_name == 'workflow_dispatch' || hashFiles('docs/linux/PACKAGING-MARKER') != ''
        env:
          NODE_ENV: production
        run: pnpm run build

      - name: Prepare deployment
        if: github.event_name == 'workflow_dispatch' || hashFiles('docs/linux/PACKAGING-MARKER') != ''
        run: pnpm nx run @vortex/main:publish
        env:
          NODE_ENV: production
          VORTEX_ELECTRON_REBUILD: "skip"

      - name: Rebuild packaged native modules
        if: github.event_name == 'workflow_dispatch' || hashFiles('docs/linux/PACKAGING-MARKER') != ''
        working-directory: src/main/dist
        # pnpm exec would re-install this deploy tree using the parent
        # workspace's catalogs; use the already installed binaries instead.
        run: npx --no-install electron-rebuild

      - name: Verify native modules in deploy tree
        if: github.event_name == 'workflow_dispatch' || hashFiles('docs/linux/PACKAGING-MARKER') != ''
        working-directory: src/main/dist
        # electron-builder silently ships whatever the deploy tree contains.
        # Fail loudly when a required native addon was not built. loot is the
        # known exception: node-loot ships Windows-only loot_api artifacts and
        # has no Linux prebuild, so loot.node cannot be produced on a Linux CI
        # (open product item N-03). Its absence is reported, not fatal; the
        # packaged artifact must not silently claim LOOT sorting works.
        run: |
          failures=0
          for pkg in "winapi-bindings" "leveldown" "drivelist" "@parcel/watcher" "xxhash-addon" "@nexusmods/fomod-installer-native"; do
            if find "node_modules/$pkg" -name '*.node' -print -quit 2>/dev/null | grep -q .; then
              echo "OK: $pkg"
            else
              echo "ERROR: no native addon found for $pkg"
              failures=$((failures + 1))
            fi
          done
          if find "node_modules/loot" -name '*.node' -print -quit 2>/dev/null | grep -q .; then
            echo "OK: loot"
          else
            echo "WARN: loot has no Linux .node (N-03, LOOT sorting unavailable)"
          fi
          exit "$failures"

      - name: Package Linux
        if: github.event_name == 'workflow_dispatch' || hashFiles('docs/linux/PACKAGING-MARKER') != ''
        working-directory: src/main/dist
        env:
          # electron-builder hard-links unpacked modules; on this workspace's
          # pnpm deploy layout the same module can be selected twice and the
          # second link fails with EEXIST (builder-util only falls back to a
          # copy on EXDEV). Disable hard links so the copy is idempotent.
          USE_HARD_LINKS: "false"
        run: npx --no-install electron-builder --config ./electron-builder.config.json --publish never

      - name: Verify packaged dependencies
        if: github.event_name == 'workflow_dispatch' || hashFiles('docs/linux/PACKAGING-MARKER') != ''
        run: node scripts/verify-packaged-asar.mjs --asar dist/linux-unpacked/resources/app.asar

      - name: Boot smoke (xvfb)
        if: github.event_name == 'workflow_dispatch' || hashFiles('docs/linux/PACKAGING-MARKER') != ''
        # The packaged app has never been run: this starts the real binary
        # under a virtual display and proves the main process + a renderer page
        # come up, so a broken payload (native addon that fails to load, missing
        # runtime lib, bad asar) fails here rather than on a user's machine.
        run: |
          set -euxo pipefail
          cd dist
          export DISPLAY=:99
          rm -rf smoke-userdata smoke-boot.log
          Xvfb :99 -screen 0 1280x800x24 &
          XVFB_PID=$!
          trap 'kill $XVFB_PID 2>/dev/null || true; pkill -f linux-unpacked/vortex 2>/dev/null || true' EXIT
          sleep 1
          ./linux-unpacked/vortex --no-sandbox --disable-gpu --remote-debugging-port=9222 --user-data-dir="$PWD/smoke-userdata" > smoke-boot.log 2>&1 &
          APP_PID=$!
          ok=0
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:9222/json/version > /dev/null 2>&1; then ok=1; break; fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          echo "--- smoke-boot.log (tail) ---"
          tail -n 40 smoke-boot.log || true
          if [ "$ok" -ne 1 ]; then
            echo "BOOT SMOKE FAILED: DevTools endpoint not reachable in 120s"
            exit 1
          fi
          curl -fsS http://127.0.0.1:9222/json | grep -q '"type": "page"'
          echo "BOOT SMOKE OK: main process and renderer page are up"
          node ../scripts/capture-smoke-screenshot.mjs 127.0.0.1 9222 "$PWD/smoke-screenshot.png" \
            || echo "screenshot unavailable (best effort)"
          kill "$APP_PID" 2>/dev/null || true

      - name: AppImage payload smoke
        # The zip/deb/rpm wrap the same unpacked tree the boot smoke ran; the
        # AppImage is the only target with its own runtime, so prove the
        # actual AppImage artifact boots (no FUSE on CI -> extract-and-run).
        if: github.event_name == 'workflow_dispatch' || hashFiles('docs/linux/PACKAGING-MARKER') != ''
        run: |
          set -euxo pipefail
          cd dist
          VORTEX_APPIMAGE=$(ls Vortex-*.AppImage | head -n1)
          test -n "$VORTEX_APPIMAGE"
          file "$VORTEX_APPIMAGE"
          ./"$VORTEX_APPIMAGE" --appimage-extract >/dev/null
          trap 'rm -rf squashfs-root' EXIT
          test -d squashfs-root
          DESKTOP=$(ls squashfs-root/*.desktop | head -n1)
          echo "--- embedded .desktop ---"
          cat "$DESKTOP"
          grep -Eq '^Exec=AppRun' "$DESKTOP"
          ICON=$(find squashfs-root -maxdepth 2 -iname '*.png' | head -n1)
          test -n "$ICON"
          echo "embedded icon: $ICON"
          export DISPLAY=:98
          Xvfb :98 -screen 0 1280x800x24 >/dev/null 2>&1 &
          XVFB_PID=$!
          trap 'rm -rf squashfs-root; kill $XVFB_PID 2>/dev/null || true; pkill -f Vortex-1.0.0-linux 2>/dev/null || true' EXIT
          sleep 1
          rm -rf appimage-smoke-userdata appimage-smoke.log
          ./"$VORTEX_APPIMAGE" --appimage-extract-and-run --no-sandbox --disable-gpu --remote-debugging-port=9224 --user-data-dir="$PWD/appimage-smoke-userdata" > appimage-smoke.log 2>&1 &
          APP_PID=$!
          ok=0
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:9224/json/version > /dev/null 2>&1; then ok=1; break; fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          echo "--- appimage-smoke.log (tail) ---"
          tail -n 30 appimage-smoke.log || true
          if [ "$ok" -ne 1 ]; then
            echo "APPIMAGE SMOKE FAILED: DevTools endpoint not reachable in 120s"
            exit 1
          fi
          curl -fsS http://127.0.0.1:9224/json | grep -q '"type": "page"'
          echo "APPIMAGE SMOKE OK: AppImage boots via extract-and-run"
          kill "$APP_PID" 2>/dev/null || true

      - name: Verify deb/rpm payload contents
        if: github.event_name == 'workflow_dispatch' || hashFiles('docs/linux/PACKAGING-MARKER') != ''
        run: |
          set -euxo pipefail
          cd dist
          DEB=$(ls Vortex_*.deb | head -n1)
          echo "--- $DEB (desktop/icon/binary) ---"
          dpkg-deb -c "$DEB" | grep -E 'usr/share/applications|usr/share/icons|/usr/bin/' | head -n 20
          RPM=$(ls Vortex-*.rpm | head -n1)
          if command -v rpm >/dev/null 2>&1; then
            echo "--- $RPM (desktop/icon/binary) ---"
            rpm -qlp "$RPM" 2>/dev/null | grep -E 'share/applications|share/icons|/usr/bin/' | head -n 20
          else
            echo "rpm tool not installed; skipping rpm listing (build already succeeded)"
          fi

      - name: Checksums and metadata
        if: github.event_name == 'workflow_dispatch' || hashFiles('docs/linux/PACKAGING-MARKER') != ''
        run: |
          cd dist
          find . -maxdepth 1 -type f \( -name '*.zip' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.tar.*' \) -exec sha256sum {} \; | tee SHA256SUMS
          cat > build-metadata.json <<EOF
          {
            "source_sha": "${{ github.sha }}",
            "upstream_base_sha": "9c641bd78f7f551df3645a0f5b2bf08fe656e78f",
            "runner_os": "${{ runner.os }}",
            "runner_arch": "${{ runner.arch }}",
            "runner_image": "ubuntu-24.04",
            "node": "24.20.0",
            "pnpm": "11.10.0",
            "ci_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch' || hashFiles('docs/linux/PACKAGING-MARKER') != ''
        with:
          name: vortex-linux-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.rpm
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.*
            dist/smoke-screenshot.png
            dist/smoke-boot.log
            dist/SHA256SUMS
            dist/build-metadata.json
          if-no-files-found: error
          retention-days: 30