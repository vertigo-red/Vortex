name: Linux readiness (fork branch)

# Workflow for the native Linux port, restricted to the fork and the dedicated
# branch. verify runs on every push; the package job's heavy steps run only
# while the tracked marker file `docs/linux/PACKAGING-MARKER` exists (or
# manually, where dispatch is registered). Nothing here signs, publishes
# releases, runs NPM publish, or touches upstream secrets.

on:
  push:
    branches:
      - "linux/native-readiness-*"
  workflow_dispatch:

concurrency:
  group: linux-readiness-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'vertigo-red/Vortex' && startsWith(github.ref_name, 'linux/native-readiness-')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NX_DAEMON: false
      VORTEX_ELECTRON_REBUILD: defer
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.10.0

      - uses: actions/setup-node@v6
        with:
          node-version: "24.17.0"
          cache: "pnpm"

      - name: Fix pnpm node-gyp permissions
        run: find "$PNPM_HOME" -path '*/node-gyp/gyp/gyp_main.py' -exec chmod +x {} \;

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libarchive-dev rpm

      - name: Cache native module builds
        uses: actions/cache@v6
        with:
          path: |
            node_modules/.pnpm/@nexusmods+fomod-installer-native@*/node_modules/@nexusmods/fomod-installer-native/build
            node_modules/.pnpm/@nexusmods+fomod-installer-native@*/node_modules/@nexusmods/fomod-installer-native/bin
            node_modules/.pnpm/drivelist@*/node_modules/drivelist/build
            node_modules/.pnpm/drivelist@*/node_modules/drivelist/bin
            node_modules/.pnpm/leveldown@*/node_modules/leveldown/build
            node_modules/.pnpm/xxhash-addon@*/node_modules/xxhash-addon/bin
            node_modules/.pnpm/@parcel+watcher@*/node_modules/@parcel/watcher/build
            node_modules/.pnpm/@parcel+watcher@*/node_modules/@parcel/watcher/bin
          key: linux-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'src/main/postinstall.mjs') }}

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Rebuild Electron native modules
        run: pnpm --filter @vortex/main exec electron-rebuild

      - name: Verify workspace
        run: pnpm run verify

  package:
    needs: verify
    # The job always runs (cheap until the marker test). The expensive
    # packaging steps are gated individually: hashFiles is evaluated at step
    # level, which the workflow validator accepts, and it is deterministic --
    # a commit-message scan of the push head_commit payload is not. The
    # marker is committed while artifacts are wanted and deleted once they
    # are not; dispatch always packages.
    if: github.repository == 'vertigo-red/Vortex' && startsWith(github.ref_name, 'linux/native-readiness-')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NX_DAEMON: false
      VORTEX_ELECTRON_REBUILD: defer
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.10.0

      - uses: actions/setup-node@v6
        with:
          node-version: "24.17.0"
          cache: "pnpm"

      - name: Fix pnpm node-gyp permissions
        run: find "$PNPM_HOME" -path '*/node-gyp/gyp/gyp_main.py' -exec chmod +x {} \;

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libarchive-dev rpm

      - name: Cache native module builds
        uses: actions/cache@v6
        with:
          path: |
            node_modules/.pnpm/@nexusmods+fomod-installer-native@*/node_modules/@nexusmods+fomod-installer-native/build
            node_modules/.pnpm/@nexusmods+fomod-installer-native@*/node_modules/@nexusmods+fomod-installer-native/bin
            node_modules/.pnpm/drivelist@*/node_modules/drivelist/build
            node_modules/.pnpm/drivelist@*/node_modules/drivelist/bin
            node_modules/.pnpm/leveldown@*/node_modules/leveldown/build
            node_modules/.pnpm/xxhash-addon@*/node_modules/xxhash-addon/bin
            node_modules/.pnpm/@parcel+watcher@*/node_modules/@parcel/watcher/build
            node_modules/.pnpm/@parcel+watcher@*/node_modules/@parcel/watcher/bin
          key: linux-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'src/main/postinstall.mjs') }}

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Set test version
        if: github.event_name == 'workflow_dispatch' || hashFiles('docs/linux/PACKAGING-MARKER') != ''
        run: >-
          pnpm -F @vortex/main version
          1.0.0-linux.${{ github.run_number }}
          --no-git-tag-version --no-git-checks --allow-same-version

      - name: Build workspace
        if: github.event_name == 'workflow_dispatch' || hashFiles('docs/linux/PACKAGING-MARKER') != ''
        env:
          NODE_ENV: production
        run: pnpm run build

      - name: Prepare deployment
        if: github.event_name == 'workflow_dispatch' || hashFiles('docs/linux/PACKAGING-MARKER') != ''
        run: pnpm nx run @vortex/main:publish
        env:
          NODE_ENV: production
          VORTEX_ELECTRON_REBUILD: "skip"

      - name: Rebuild packaged native modules
        if: github.event_name == 'workflow_dispatch' || hashFiles('docs/linux/PACKAGING-MARKER') != ''
        working-directory: src/main/dist
        # pnpm exec would re-install this deploy tree using the parent
        # workspace's catalogs; use the already installed binaries instead.
        run: npx --no-install electron-rebuild

      - name: Verify native modules in deploy tree
        if: github.event_name == 'workflow_dispatch' || hashFiles('docs/linux/PACKAGING-MARKER') != ''
        working-directory: src/main/dist
        # electron-builder silently ships whatever the deploy tree contains.
        # Fail loudly when a required native addon was not built. loot is the
        # known exception: node-loot ships Windows-only loot_api artifacts and
        # has no Linux prebuild, so loot.node cannot be produced on a Linux CI
        # (open product item N-03). Its absence is reported, not fatal; the
        # packaged artifact must not silently claim LOOT sorting works.
        run: |
          failures=0
          for pkg in "winapi-bindings" "leveldown" "drivelist" "@parcel/watcher" "xxhash-addon" "@nexusmods/fomod-installer-native"; do
            if find "node_modules/$pkg" -name '*.node' -print -quit 2>/dev/null | grep -q .; then
              echo "OK: $pkg"
            else
              echo "ERROR: no native addon found for $pkg"
              failures=$((failures + 1))
            fi
          done
          if find "node_modules/loot" -name '*.node' -print -quit 2>/dev/null | grep -q .; then
            echo "OK: loot"
          else
            echo "WARN: loot has no Linux .node (N-03, LOOT sorting unavailable)"
          fi
          exit "$failures"

      - name: Package Linux
        if: github.event_name == 'workflow_dispatch' || hashFiles('docs/linux/PACKAGING-MARKER') != ''
        working-directory: src/main/dist
        env:
          # electron-builder hard-links unpacked modules; on this workspace's
          # pnpm deploy layout the same module can be selected twice and the
          # second link fails with EEXIST (builder-util only falls back to a
          # copy on EXDEV). Disable hard links so the copy is idempotent.
          USE_HARD_LINKS: "false"
        run: npx --no-install electron-builder --config ./electron-builder.config.json --publish never

      - name: Verify packaged dependencies
        if: github.event_name == 'workflow_dispatch' || hashFiles('docs/linux/PACKAGING-MARKER') != ''
        run: node scripts/verify-packaged-asar.mjs --asar dist/linux-unpacked/resources/app.asar

      - name: Checksums and metadata
        if: github.event_name == 'workflow_dispatch' || hashFiles('docs/linux/PACKAGING-MARKER') != ''
        run: |
          cd dist
          find . -maxdepth 1 -type f \( -name '*.zip' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.tar.*' \) -exec sha256sum {} \; | tee SHA256SUMS
          cat > build-metadata.json <<EOF
          {
            "source_sha": "${{ github.sha }}",
            "upstream_base_sha": "9c641bd78f7f551df3645a0f5b2bf08fe656e78f",
            "runner_os": "${{ runner.os }}",
            "runner_arch": "${{ runner.arch }}",
            "runner_image": "ubuntu-24.04",
            "node": "24.17.0",
            "pnpm": "11.10.0",
            "ci_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch' || hashFiles('docs/linux/PACKAGING-MARKER') != ''
        with:
          name: vortex-linux-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.rpm
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.*
            dist/SHA256SUMS
            dist/build-metadata.json
          if-no-files-found: error
          retention-days: 30