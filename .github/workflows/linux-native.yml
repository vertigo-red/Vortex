name: Native Linux

on:
  push:
    branches: [feat/native-linux]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wine-tools:
    name: Wine CLI tool launches (${{ matrix.runtime.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - name: Wine 9
            image: ubuntu:24.04
            version: "9"
          - name: Wine 10
            image: debian:trixie-slim
            version: "10"
    container: ${{ matrix.runtime.image }}
    timeout-minutes: 15
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      VORTEX_TEST_WINE_MAJOR: ${{ matrix.runtime.version }}
    steps:
      - name: Install Wine test runtime
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates wine64 gcc-mingw-w64-x86-64 unzip libicu-dev
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.20.0"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"
      - name: Verify Wine batch launches
        run: node scripts/verify-linux-batch.mjs
      - name: Verify Wine user folder redirections
        run: node scripts/verify-linux-user-folders.mjs
      - name: Verify real Divine PAK operations
        run: node scripts/verify-linux-divine.mjs
  linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NX_DAEMON: "false"
      VORTEX_ELECTRON_REBUILD: "defer"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev patchelf rpm xvfb xauth libgtk-3-0t64 libnss3 libasound2t64 gcc-mingw-w64-x86-64
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vortex/main exec electron-rebuild
      - name: Verify workspace
        run: pnpm run verify
      - name: Package native Linux
        run: pnpm run package:linux
      - name: Verify packaged dependency versions
        run: node scripts/verify-packaged-asar.mjs --asar dist/linux-unpacked/resources/app.asar
      - name: Verify relocated native FOMOD
        run: node scripts/verify-linux-fomod.mjs dist/linux-unpacked/resources
      - name: Verify packaged LOOT sorting and worker lifecycle
        run: node scripts/verify-linux-loot.mjs dist/linux-unpacked/vortex dist/linux-unpacked/resources
      - name: Verify packaged Linux startup
        run: xvfb-run -a node scripts/smoke-linux-package.mjs dist/linux-unpacked/vortex --no-sandbox
      - name: Install DEB and verify desktop integration
        run: |
          sudo apt-get install -y ./dist/*.deb
          node scripts/verify-linux-installation.mjs installed
      - name: Verify installed Linux startup with sandbox
        run: |
          node scripts/verify-linux-fomod.mjs /opt/Vortex/resources
          node scripts/verify-linux-loot.mjs /usr/bin/vortex /opt/Vortex/resources
          xvfb-run -a node scripts/smoke-linux-package.mjs /usr/bin/vortex
      - name: Remove DEB and verify cleanup
        run: |
          sudo apt-get remove -y vortex
          node scripts/verify-linux-installation.mjs removed
      - uses: actions/upload-artifact@v7
        with:
          name: vortex-native-linux-x64
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/linux-startup.png
            dist/linux-installed-startup.png
          if-no-files-found: error
          retention-days: 14
