name: ChatGPT Flatpak pnpm migration

on:
  push:
    branches:
      - linux/native-readiness-chatgpt-sol56-20260909
    paths:
      - .github/chatgpt-flatpak-pnpm-migrate-request

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor == 'vertigo-red'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Apply pnpm migration
        run: python scripts/chatgpt-flatpak-pnpm-migrate.py
      - name: Generate Flatpak pnpm sources
        run: python flatpak/scripts/flatpak_sources.py --only pnpm --force
      - name: Verify migration
        run: |
          set -euxo pipefail
          git diff --check
          test -s flatpak/generated-sources.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('flatpak/generated-sources.json').read_text())
          assert isinstance(data, list)
          assert len(data) > 100, len(data)
          print('generated source entries:', len(data))
          PY
          grep -RInE 'pnpm-lock.yaml|flatpak-pnpm|pnpm-store|electron-node-headers' flatpak/scripts flatpak/com.nexusmods.vortex.yaml flatpak/generated-sources.json | head -n 80
          ! grep -RIn 'yarn.lock' flatpak/scripts flatpak/com.nexusmods.vortex.yaml
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flatpak/scripts/_flatpak_env.py \
                  flatpak/scripts/_flatpak_pnpm_hash.py \
                  flatpak/scripts/_flatpak_yarn_hash.py \
                  flatpak/scripts/flatpak_sources.py \
                  flatpak/scripts/_flatpak_workflow.py \
                  flatpak/com.nexusmods.vortex.yaml \
                  flatpak/generated-sources.json \
                  flatpak/generated-sources.hash
          git diff --cached --check
          git commit -m "fix(flatpak): migrate offline build inputs to pnpm"
          git push origin HEAD:${GITHUB_REF_NAME}
