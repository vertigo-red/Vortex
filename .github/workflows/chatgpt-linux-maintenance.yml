name: ChatGPT Linux one-shot maintenance

on:
  push:
    branches:
      - linux/native-readiness-chatgpt-sol56-20260909
    paths:
      - .github/chatgpt-linux-maintenance-request

permissions:
  contents: write

jobs:
  maintain:
    if: github.actor == 'vertigo-red'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge current upstream master without rewriting history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Nexus-Mods/Vortex.git
          git fetch --no-tags upstream master
          upstream_sha="$(git rev-parse FETCH_HEAD)"
          echo "upstream_sha=${upstream_sha}"

          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "Upstream is already merged"
            exit 0
          fi

          if ! git merge --no-ff --no-edit FETCH_HEAD; then
            echo "Merge conflicts:"
            git diff --name-only --diff-filter=U
            git merge --abort
            exit 1
          fi

          # GITHUB_TOKEN lacks workflows:write. Keep the branch's workflow directory
          # byte-for-byte at its pre-merge state, including deleting upstream-only files.
          first_parent="$(git rev-parse HEAD^1)"
          git rm -r --ignore-unmatch .github/workflows
          git checkout "${first_parent}" -- .github/workflows
          git commit --amend --no-edit
          git diff-tree --check HEAD
          git push origin HEAD:${GITHUB_REF_NAME}
