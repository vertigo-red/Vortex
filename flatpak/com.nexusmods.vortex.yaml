# Docs: Electron - https://docs.flatpak.org/en/latest/electron.html
# Docs: Dotnet - https://docs.flatpak.org/en/latest/dotnet.html
app-id: com.nexusmods.vortex
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "25.08"
command: run.sh

sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
  - org.freedesktop.Sdk.Extension.dotnet9

build-options:
  # The workspace requires exactly Node 24.20.0. Put the hash-pinned Node
  # source ahead of the SDK extension and use it as the externally managed
  # build runtime inside the offline Flatpak sandbox.
  prepend-path: /run/build/vortex/flatpak-node-runtime/bin:/run/build/vortex/.flatpak-bin:/usr/lib/sdk/node24/bin:/usr/lib/sdk/dotnet9/bin
  append-ld-library-path: /usr/lib/sdk/dotnet9/lib
  env:
    # Flatpak builds run offline. flatpak-node-generator populates the pnpm
    # store and Electron/node-gyp caches from generated-sources.json.
    npm_config_cache: /run/build/vortex/flatpak-node/npm-cache
    npm_config_offline: "true"
    XDG_CACHE_HOME: /run/build/vortex/flatpak-node/cache

    # pnpm 11 re-verifies every frozen lockfile entry against registry metadata.
    # That pass cannot run inside Flatpak's offline build sandbox. Trust only the
    # already-reviewed frozen lockfile here; Flatpak still verifies source hashes.
    PNPM_CONFIG_TRUST_LOCKFILE: "true"

    # pnpm 11 normally auto-runs install before pnpm run/exec when it decides
    # node_modules needs verification. The sandbox already uses the hash-pinned
    # Node runtime above, so an implicit runtime download would violate offline builds.
    PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"

    # src/main/postinstall.mjs otherwise starts electron-rebuild while pnpm is
    # still running dependency lifecycle scripts. Stage FOMOD's companion .so
    # after install completes, then rebuild explicitly below.
    VORTEX_ELECTRON_REBUILD: "defer"

    # Dotnet SDK settings for build-time tools (runtime DOTNET_ROOT is set via finish-args).
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    DOTNET_NOLOGO: "1"
    DOTNET_ROOT: /usr/lib/sdk/dotnet9/lib
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

    # Build stability: avoid parallel extension builds.
    # Skip git submodule updates (submodules are already fetched by flatpak-builder).
    # FOMOD installer builds are still needed and run during preinstall.
    NO_PARALLEL: "1"
    VORTEX_SKIP_SUBMODULES: "1"

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --share=network
  # Full host filesystem access is required for modding workflows:
  # game installs can be anywhere, deployment uses hardlinks/symlinks/moves,
  # plugins and external tools need arbitrary path access.
  # Portals are not viable because scanning and deployment are background ops
  # that can't wait for user-mediated prompts.
  - --filesystem=host
  - --talk-name=org.kde.StatusNotifierWatcher
  - --system-talk-name=org.freedesktop.UDisks2
  # Required for xdg-settings to register nxm:// protocol handler on host
  - --talk-name=org.freedesktop.Flatpak
  # Runtime: .NET runtime location for framework-dependent tools
  - --env=DOTNET_ROOT=/app/lib/dotnet
  # Integration: disable internal updater (Flatpak handles updates)
  - --env=IGNORE_UPDATES=yes
  - --env=IS_FLATPAK=true
  # Integration: use gio for trash, respect host cursor theme
  - --env=ELECTRON_TRASH=gio
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons

modules:
  - name: dotnet-runtime
    buildsystem: simple
    build-commands:
      # Install the .NET runtime into /app/lib/dotnet for framework-dependent tools.
      - /usr/lib/sdk/dotnet9/bin/install.sh

  - name: vortex
    buildsystem: simple
    build-commands:
      # Steps match `.github/workflows/package.yml` where possible.

      # Bootstrap the exact pnpm version pinned by package.json. The archive
      # source uses Flatpak's default strip-components=1, so npm's leading
      # package/ directory is removed under flatpak-pnpm.
      - |
        test "$(node --version)" = "v24.20.0"
        mkdir -p .flatpak-bin
        cat > .flatpak-bin/pnpm <<'EOF'
        #!/bin/sh
        exec node /run/build/vortex/flatpak-pnpm/bin/pnpm.cjs "$@"
        EOF
        chmod +x .flatpak-bin/pnpm
        test "$(pnpm --version)" = "11.10.0"

      - |
        cat > NuGet.Config <<'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <configuration>
          <packageSources>
            <clear />
            <add key="offline" value="flatpak-nuget-sources" />
          </packageSources>
        </configuration>
        EOF

      # flatpak-node-generator stores Electron headers in the XDG node-gyp
      # cache. electron-rebuild still expects ~/.electron-gyp. Install first
      # with Vortex's rebuild deferred, then stage FOMOD's Linux companion
      # library from its pinned npm package before rebuilding Linux native addons.
      # winapi-bindings is intentionally excluded: its binding.gyp has sources
      # only under OS=="win", so it is not a Linux native addon.
      - |
        rm -rf "$HOME/.electron-gyp"
        ln -s "$XDG_CACHE_HOME/node-gyp" "$HOME/.electron-gyp"
        pnpm install --offline --frozen-lockfile --no-runtime

        fomod_pkg="$(find node_modules/.pnpm -path '*/node_modules/@nexusmods/fomod-installer-native/package.json' -print -quit)"
        test -n "$fomod_pkg"
        fomod_dir="$(dirname "$fomod_pkg")"
        test -f "$fomod_dir/prebuilds/linux-x64/ModInstaller.Native.so"
        cp -f "$fomod_dir/prebuilds/linux-x64/ModInstaller.Native.so" "$fomod_dir/ModInstaller.Native.so"

        cd src/main
        ./node_modules/.bin/electron-rebuild --only @nexusmods/fomod-installer-native,drivelist,leveldown,xxhash-addon,@parcel/watcher

      # The main Nx build normally downloads level_pivot DuckDB extensions.
      # Flatpak builds have no network access, so materialize the two pinned
      # compressed sources into the exact cache paths the build task checks.
      - |
        mkdir -p src/main/build/duckdb-extensions/v1.5.1/linux_amd64
        mkdir -p src/main/build/duckdb-extensions/v1.5.1/windows_amd64
        gzip -dc flatpak-duckdb/level_pivot-linux_amd64.duckdb_extension.gz > src/main/build/duckdb-extensions/v1.5.1/linux_amd64/level_pivot.duckdb_extension
        gzip -dc flatpak-duckdb/level_pivot-windows_amd64.duckdb_extension.gz > src/main/build/duckdb-extensions/v1.5.1/windows_amd64/level_pivot.duckdb_extension

      # Follow the native Linux packaging pipeline: build the workspace, create
      # the deploy tree, rebuild Linux native addons in that tree, then ask
      # electron-builder only for the unpacked Linux payload used by Flatpak.
      - pnpm run build
      - pnpm nx run @vortex/main:publish
      - |
        rm -rf "$HOME/.electron-gyp"
        ln -s "$XDG_CACHE_HOME/node-gyp" "$HOME/.electron-gyp"
        cd src/main/dist
        ./node_modules/.bin/electron-rebuild --only @nexusmods/fomod-installer-native,drivelist,leveldown,xxhash-addon,@parcel/watcher
      - cd src/main/dist && USE_HARD_LINKS=false ./node_modules/.bin/electron-builder --config ./electron-builder.config.json --publish never --linux dir

      # Install the launcher, desktop file, icon, and metainfo into the Flatpak image.
      - install -Dm755 flatpak/run.sh /app/bin/run.sh
      - install -Dm644 flatpak/com.nexusmods.vortex.desktop /app/share/applications/com.nexusmods.vortex.desktop
      - install -Dm644 assets/images/vortex.png /app/share/icons/hicolor/256x256/apps/com.nexusmods.vortex.png
      - install -Dm644 flatpak/com.nexusmods.vortex.metainfo.xml /app/share/metainfo/com.nexusmods.vortex.metainfo.xml

      # Stage the built electron distribution into /app/main for runtime.
      - install -d /app/main
      - cp -a dist/linux*-unpacked/. /app/main/
    sources:
      - type: dir
        path: ..
      - type: archive
        url: https://nodejs.org/download/release/v24.20.0/node-v24.20.0-linux-x64.tar.gz
        sha256: 855d581f8a4eb1a8117e3426de25fe02770592febcfb31369aee1ffbfee9e8ec
        dest: flatpak-node-runtime
      - type: archive
        url: https://registry.npmjs.org/pnpm/-/pnpm-11.10.0.tgz
        sha256: 620b6605ea4f62fc56a6d0a98733f479071d0321e03e486b522c7e9a74617431
        dest: flatpak-pnpm
      - type: file
        url: https://nexus-mods.github.io/duckdb-level-pivot/current_release/v1.5.1/linux_amd64/level_pivot.duckdb_extension.gz
        sha256: f822a37826e1975557aeffbb30fc1a79ad4a1048b455a429ba0b6bf031013065
        dest: flatpak-duckdb
        dest-filename: level_pivot-linux_amd64.duckdb_extension.gz
      - type: file
        url: https://nexus-mods.github.io/duckdb-level-pivot/current_release/v1.5.1/windows_amd64/level_pivot.duckdb_extension.gz
        sha256: 68d730e53a1a582e2b27adda6decad5e1b9c5fc58083e871208b8095042e0ca4
        dest: flatpak-duckdb
        dest-filename: level_pivot-windows_amd64.duckdb_extension.gz
      - generated-sources.json
      - generated-nuget-sources.json
